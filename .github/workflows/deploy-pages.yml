          assets/site/application-eva-560.webp
          assets/site/application-eva-960.webp
          assets/site/batch-delivery-560.webp
          assets/site/batch-delivery-960.webp
          assets/site/batch-delivery.webp
          assets/site/foam-sample-cutaway.webp
          assets/site/foam-sample-rounded.webp
          en/index.html
          index.html
          locales/en.js
          locales/ru.js
          locales/vi.js
          locales/zh.js
          robots.txt
          ru/index.html
          sitemap.xml
          styles.css
          vi/index.html
          zh/index.html
          FILES

          python3 - <<'PY'
          from pathlib import Path
          import re

          old = "https://shengji-machinery.wp199063.chatgpt.site"
          new = "https://weiyi718.github.io"
          targets = [
              "index.html",
              "zh/index.html",
              "en/index.html",
              "vi/index.html",
              "ru/index.html",
              "robots.txt",
              "sitemap.xml",
          ]

          for relative in targets:
              path = Path("_site") / relative
              content = path.read_text(encoding="utf-8")
              if old not in content:
                  raise SystemExit(f"Expected source origin was not found in {relative}")
              with path.open("w", encoding="utf-8", newline="\n") as handle:
                  handle.write(content.replace(old, new))

          cloudflare_injection = re.compile(
              r'\s*<script>\(function\(\)\{function c\(\).*?'
              r'/cdn-cgi/challenge-platform/scripts/jsd/main\.js.*?</script>',
              re.DOTALL,
          )
          for path in Path("_site").rglob("*.html"):
              content = path.read_text(encoding="utf-8")
              content = cloudflare_injection.sub("", content)
              if "/cdn-cgi/" in content:
                  raise SystemExit(f"Unexpected Cloudflare injection remains in {path}")
              with path.open("w", encoding="utf-8", newline="\n") as handle:
                  handle.write(content)
          PY

          touch _site/.nojekyll
          test "$(find _site -type f | wc -l)" -eq 167
          test "$(find _site/assets -type f | wc -l)" -eq 152
          ! grep -R --fixed-strings "shengji-machinery.wp199063.chatgpt.site" _site
          ! grep -R --fixed-strings "/cdn-cgi/" _site
          grep -q --fixed-strings "https://weiyi718.github.io/zh/" _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

