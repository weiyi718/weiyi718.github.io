name: Deploy Shengji Machinery

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified static site
        env:
          SOURCE_ORIGIN: https://shengji-machinery.wp199063.chatgpt.site
          TARGET_ORIGIN: https://weiyi718.github.io
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf _site
          mkdir -p _site

          while IFS= read -r path; do
            [ -n "$path" ] || continue
            mkdir -p "_site/$(dirname "$path")"
            curl --fail --show-error --silent --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 20 --max-time 120 \
              "${SOURCE_ORIGIN}/${path}" -o "_site/${path}"
